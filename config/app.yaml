server:
  host: "0.0.0.0"
  port: 8000

storage:
  upload_path: "data/uploads"

execution:
  max_waiting_tasks: 10
  worker_concurrency: 2
  per_task_rule_concurrency: 5

external_api_limits:
  default_max_concurrency: 2
  by_endpoint: {}

limits:
  max_file_size_mb: 20
  max_cells: 50000
  max_images: 50
  rate_limit: "10/minute"

summarizer:
  max_cell_length: 200
  max_summary_length: 4000
  max_region_length: 8000
